name: Temporary Release Audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    if: github.head_ref == 'agent/security-release-dependency-patch'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout security branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release audit checks
        shell: bash
        run: |
          set +e
          echo '=== TYPESCRIPT ==='
          pnpm exec tsc --noEmit --pretty false
          TSC_STATUS=$?
          echo "TSC_STATUS=$TSC_STATUS"

          echo '=== ESLINT ==='
          pnpm lint
          LINT_STATUS=$?
          echo "LINT_STATUS=$LINT_STATUS"

          echo '=== PRODUCTION DEPENDENCY AUDIT ==='
          pnpm audit --prod --audit-level=low
          AUDIT_STATUS=$?
          echo "AUDIT_STATUS=$AUDIT_STATUS"

          echo '=== SUMMARY ==='
          echo "TypeScript: $TSC_STATUS"
          echo "ESLint: $LINT_STATUS"
          echo "Dependency audit: $AUDIT_STATUS"
          exit 0
