name: Release Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify legacy appointment cleanup
        run: |
          test ! -e app/api/appointment/route.ts
          test ! -e app/appointment/page.tsx
          test ! -e app/appointment/thank-you/page.tsx
          if grep -R --line-number --exclude-dir=.git -E '6589418791|Master Qiming|qimenAppointmentLeadId|qimenAppointmentMessage|qimenAppointmentWhatsAppUrl' app components lib; then
            echo "Legacy appointment code is still present."
            exit 1
          fi
          echo "Legacy appointment implementation and identifiers are absent."

      - name: TypeScript validation
        run: pnpm typecheck

      - name: Build Next.js application
        run: pnpm build
