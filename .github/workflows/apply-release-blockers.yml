name: Apply Remaining Release Blockers

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/release-blockers-zoho-contact'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Apply scoped code patches
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old[:100]!r}")
              file.write_text(text.replace(old, new, 1))

          form_path = Path("components/consultation-form.tsx")
          form = form_path.read_text()
          form = form.replace(
              'import { usePathname, useRouter } from "next/navigation";',
              'import { usePathname } from "next/navigation";',
              1,
          )
          form = form.replace('  const router = useRouter();\n', '', 1)
          form = form.replace(
              '  const [submitting, setSubmitting] = useState(false);\n',
              '  const [submitting, setSubmitting] = useState(false);\n  const [confirmedReference, setConfirmedReference] = useState("");\n',
              1,
          )
          form = form.replace('    if (!validation.success) {', '    if (validation.success === false) {', 1)

          submit_start = form.index('  async function submit(event: FormEvent<HTMLFormElement>) {')
          submit_end = form.index('\n\n  return (', submit_start)
          submit_function = '''  async function submit(event: FormEvent<HTMLFormElement>) {
            event.preventDefault();
            setFormError("");
            setFieldErrors({});

            const payload = {
              ...form,
              idempotencyKey: idempotencyKey.current || makeIdempotencyKey(),
              attribution: collectBrowserAttribution(),
            };
            const validation = validateConsultationSubmission(payload);
            if (validation.success === false) {
              setFieldErrors(translatedFieldErrors(validation.fieldErrors));
              setFormError(t("请检查标示的项目。", "Please check the highlighted fields."));
              return;
            }

            setSubmitting(true);
            let reference = "";

            try {
              const response = await fetch("/api/contact", {
                method: "POST",
                headers: { "content-type": "application/json" },
                body: JSON.stringify(payload),
              });
              const result = (await response.json().catch(() => null)) as ConsultationSubmissionResponse | null;

              if (!response.ok || !result?.ok || !result.reference) {
                if (result?.fieldErrors) setFieldErrors(translatedFieldErrors(result.fieldErrors));
                throw new Error("SUBMISSION_FAILED");
              }

              reference = result.reference;
            } catch {
              setFormError(
                t(
                  "目前无法提交。你的资料仍保留在表格中，请稍后再试，或直接通过WhatsApp联系我们。",
                  "We could not submit your enquiry at this moment. Your information remains in the form. Please try again or contact us directly on WhatsApp."
                )
              );
              setSubmitting(false);
              return;
            }

            setConfirmedReference(reference);

            try {
              sessionStorage.setItem(
                "qimen-contact-success",
                JSON.stringify({
                  reference,
                  consultationType: form.consultationType,
                  recordedAt: Date.now(),
                })
              );
            } catch {
              // A confirmed submission must remain successful if browser storage is unavailable.
            }

            const locale = pathname.startsWith("/zh") ? "zh" : pathname.startsWith("/en") ? "en" : "";
            const successPath = locale ? `/${locale}/contact-success` : "/contact-success";
            const successUrl = `${successPath}?ref=${encodeURIComponent(reference)}`;

            try {
              window.location.assign(successUrl);
            } catch {
              setSubmitting(false);
            }
          }'''
          form = form[:submit_start] + submit_function + form[submit_end:]

          confirmed_ui = '''  if (confirmedReference) {
            return (
              <div role="status" className={`border border-[#d6ad63]/35 bg-[#0d0b09] p-6 text-white shadow-2xl md:p-8 ${className}`}>
                <p className="text-xs font-bold uppercase tracking-[0.22em] text-[#d6ad63]">
                  {t("咨询申请已收到", "Enquiry Received")}
                </p>
                <h2 className="mt-4 text-3xl font-semibold text-[#f4dfb0]">
                  {t("谢谢，我们已经收到你的咨询。", "Thank you. We have received your enquiry.")}
                </h2>
                <p className="mt-4 text-sm leading-7 text-white/65">
                  {t(
                    "即使浏览器未能跳转，你的提交仍然有效。我们会在一个工作日内联系你。",
                    "Even if the browser could not redirect, your submission is confirmed. We will contact you within one business day."
                  )}
                </p>
                <p className="mt-5 text-sm font-semibold text-[#d6ad63]">
                  {t("参考编号", "Reference")}: {confirmedReference}
                </p>
              </div>
            );
          }

          return (
            <form'''
          if '  return (\n    <form' not in form:
              raise SystemExit('Consultation form return marker not found')
          form = form.replace('  return (\n    <form', confirmed_ui, 1)
          form_path.write_text(form)

          for filename in [
              "components/cases-section.tsx",
              "components/energy-clearing-section.tsx",
              "components/services-section.tsx",
          ]:
              path = Path(filename)
              text = path.read_text()
              if 'ease: "easeOut"' not in text:
                  raise SystemExit(f"Animation easing marker missing in {filename}")
              path.write_text(text.replace('ease: "easeOut"', 'ease: "easeOut" as const'))

          course_path = Path("app/api/course-registration/route.ts")
          course = course_path.read_text()
          course = course.replace(
              'const DEFAULT_REPLY_TO = "info@qmfeng.com";\n',
              '''const DEFAULT_REPLY_TO = "info@qmfeng.com";
          const EXTERNAL_REQUEST_TIMEOUT_MS = 8_000;

          function httpsWebhookUrl(value: string) {
            const endpoint = new URL(value);
            if (endpoint.protocol !== "https:") throw new Error("Webhook URL must use HTTPS.");
            return endpoint;
          }
          ''',
              1,
          )
          course = course.replace(
              '  const response = await fetch(url, {\n    method: "POST",',
              '  const response = await fetch(httpsWebhookUrl(url), {\n    method: "POST",',
              1,
          )
          course = course.replace(
              '    cache: "no-store",\n  });\n  if (!response.ok) throw new Error(`Course webhook returned ${response.status}`);',
              '    cache: "no-store",\n    signal: AbortSignal.timeout(EXTERNAL_REQUEST_TIMEOUT_MS),\n  });\n  if (!response.ok) throw new Error(`Course webhook returned ${response.status}`);',
              1,
          )
          lead_start = course.index('async function lead(url: string, record: Record<string, unknown>) {')
          lead_end = course.index('\nfunction emailAddressFromSender', lead_start)
          lead_function = '''async function lead(url: string, record: Record<string, unknown>) {
            const response = await fetch(httpsWebhookUrl(url), {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({
                ...record,
                source: "Qimen Course Registration",
                notificationEmail: clean(process.env.COURSE_ADMIN_EMAIL, 300) || DEFAULT_REPLY_TO,
              }),
              cache: "no-store",
              signal: AbortSignal.timeout(EXTERNAL_REQUEST_TIMEOUT_MS),
            });
            if (!response.ok) throw new Error(`Lead webhook returned ${response.status}`);
            return "lead_webhook";
          }
          '''
          course = course[:lead_start] + lead_function + course[lead_end:]
          course_path.write_text(course)

          if 'searchParams.set(' in Path('app/api/contact/route.ts').read_text():
              raise SystemExit('Contact route still contains query-string payload construction')
          if 'searchParams.set(' in course_path.read_text():
              raise SystemExit('Course route still contains query-string payload construction')
          PY

      - name: Commit scoped fixes
        shell: bash
        run: |
          rm .github/workflows/apply-release-blockers.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/consultation-form.tsx components/cases-section.tsx components/energy-clearing-section.tsx components/services-section.tsx app/api/course-registration/route.ts .github/workflows/apply-release-blockers.yml
          git commit -m "Complete remaining consultation release blockers"
          git push
