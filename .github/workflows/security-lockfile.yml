name: Generate Security Lockfile

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lockfile:
    if: github.head_ref == 'agent/security-release-dependency-patch'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout security branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate

      - name: Generate lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: security-pnpm-lock
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1
